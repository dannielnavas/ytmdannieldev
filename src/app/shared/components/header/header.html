@let user = resourceMe.value();
@let isUserLoading = resourceMe.isLoading();

<header
  class="shrink-0 px-6 pt-3 pb-3 flex flex-col gap-3 border-b border-white/5 bg-[#0c0a15]/90 backdrop-blur-md z-20">
  <div class="flex items-center justify-between gap-4">

    @if($showBack()){
    <button (click)="goBack()" class="bg-white/5 hover:bg-white/10 rounded-full p-2 transition-colors cursor-pointer">
      <svg lucideArrowLeft class="w-4 h-4 text-white"></svg>
    </button>
    }

    <app-search class="w-full max-w-md md:max-w-lg" />

    <!-- User avatar / profile button -->
    <div class="flex items-center gap-3 shrink-0">
      @if (isUserLoading) {
      <!-- Skeleton state while loading user -->
      <div class="flex items-center gap-2.5 animate-pulse">
        <div class="w-8 h-8 rounded-full bg-white/10"></div>
        <div class="hidden md:flex flex-col gap-1.5">
          <div class="w-20 h-3 bg-white/10 rounded"></div>
          <div class="w-14 h-2.5 bg-white/5 rounded"></div>
        </div>
      </div>
      } @else {
      <!-- Premium badge if user has YouTube Music Premium -->
      @if (user.is_youtube_premium) {
      <div
        class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold tracking-wide bg-gradient-to-r from-amber-500/15 via-yellow-500/15 to-amber-500/15 border border-amber-500/30 text-amber-300 shadow-[0_0_12px_rgba(245,158,11,0.12)] select-none"
        title="Suscripción Premium Activa">
        <svg lucideCrown class="w-3.5 h-3.5 fill-amber-400/20 text-amber-400"></svg>
        <span>Premium</span>
      </div>
      }

      <!-- User profile chip -->
      <button type="button"
        class="flex items-center gap-2.5 py-1 px-1.5 md:pr-3 rounded-full bg-white/[0.04] hover:bg-white/[0.08] border border-white/5 hover:border-purple-500/30 transition-all duration-200 cursor-pointer select-none group shadow-sm text-left"
        [title]="
                user.full_name
                  ? user.full_name +
                    (user.youtube_handle ? ' (' + user.youtube_handle + ')' : '') +
                    (user.email ? ' • ' + user.email : '')
                  : 'Perfil de Usuario'
              ">
        <!-- Avatar -->
        <div
          class="relative w-8 h-8 rounded-full overflow-hidden shrink-0 border border-purple-500/30 bg-purple-600/20 text-purple-200 flex items-center justify-center shadow-inner">
          @if (user.profile_image && !hasAvatarError()) {
          <img [src]="user.profile_image" [alt]="user.full_name || 'Foto de perfil'" referrerpolicy="no-referrer"
            (error)="hasAvatarError.set(true)" class="w-full h-full object-cover" />
          } @else {
          <span class="text-xs font-semibold">
            {{ $lettersName() || 'U' }}
          </span>
          }

          @if (user.is_youtube_premium) {
          <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-amber-400 border-2 border-[#0c0a15]"
            title="Premium"></span>
          }
        </div>

        <!-- User Name & Handle / Email -->
        @if (user.full_name || user.youtube_handle || user.email) {
        <div class="hidden md:flex flex-col text-left min-w-0 max-w-[140px] lg:max-w-[180px] leading-tight">
          @if (user.full_name) {
          <span class="text-xs font-semibold text-neutral-100 truncate group-hover:text-purple-300 transition-colors">
            {{ user.full_name }}
          </span>
          }
          @if (user.youtube_handle || user.email) {
          <span class="text-[10px] text-neutral-400 truncate">
            {{ user.youtube_handle || user.email }}
          </span>
          }
        </div>
        }
      </button>
      }
    </div>
  </div>
</header>
