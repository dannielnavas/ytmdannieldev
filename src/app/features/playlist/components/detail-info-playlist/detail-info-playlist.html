@let info = $infoPlaylist();

<div
  class="relative overflow-hidden px-6 py-6 md:py-8 lg:px-8 border-b border-white/5 transition-all duration-700"
  [style.background]="heroGradientStyle()"
>
  <!-- Ambient backdrop blur glows extracted from image -->
  <div
    class="absolute -top-24 -left-20 w-96 h-96 rounded-full blur-3xl pointer-events-none transition-all duration-700"
    [style.background]="glowStyle1()"
  ></div>
  <div
    class="absolute top-10 right-0 w-80 h-80 rounded-full blur-3xl pointer-events-none transition-all duration-700"
    [style.background]="glowStyle2()"
  ></div>

  <div class="relative z-10 flex flex-col sm:flex-row items-center sm:items-end gap-6 md:gap-8">
    <!-- Playlist Artwork Cover -->
    <div class="relative group shrink-0">
      <div
        class="w-44 h-44 sm:w-48 sm:h-48 md:w-56 md:h-56 rounded-2xl overflow-hidden border border-white/15 bg-neutral-900 flex items-center justify-center transition-all duration-700"
        [style.box-shadow]="artworkShadowStyle()"
      >
        @if (thumbnailUrl()) {
          <img
            #coverImg
            crossorigin="anonymous"
            [src]="thumbnailUrl()"
            [alt]="info?.name || 'Carátula de playlist'"
            decoding="async"
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
            (load)="onImageLoad(coverImg)"
            (error)="onImageError()"
          />
        } @else {
          <div
            class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-purple-900/60 to-neutral-900 text-purple-300"
          >
            <svg lucideMusic class="w-16 h-16 stroke-[1.5] opacity-60 mb-2"></svg>
            <span class="text-xs font-semibold tracking-wider uppercase text-purple-200/70"
              >Sonara Playlist</span
            >
          </div>
        }
      </div>

      <!-- Quick hover play overlay on artwork -->
      <button
        type="button"
        (click)="playAll.emit()"
        class="absolute bottom-3 right-3 w-12 h-12 rounded-full bg-purple-600 hover:bg-purple-500 text-white shadow-xl shadow-black/80 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-200 transform translate-y-2 group-hover:translate-y-0 cursor-pointer focus:outline-none focus:opacity-100"
        title="Reproducir playlist"
        aria-label="Reproducir playlist"
      >
        <svg lucidePlay class="w-5 h-5 fill-white text-white translate-x-0.5"></svg>
      </button>
    </div>

    <!-- Metadata Information -->
    <div class="flex-1 flex flex-col items-center sm:items-start text-center sm:text-left min-w-0">
      <!-- Category Badge -->
      <div class="flex items-center gap-2 mb-2">
        <span
          class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold tracking-widest uppercase bg-purple-500/20 text-purple-300 border border-purple-500/30 transition-all duration-500"
          [style.background-color]="badgeStyle()['background-color']"
          [style.border-color]="badgeStyle()['border-color']"
          [style.color]="badgeStyle()['color']"
        >
          <svg lucideSparkles class="w-3 h-3"></svg>
          Playlist
        </span>
      </div>

      <!-- Playlist Title -->
      <h1
        class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-black text-white tracking-tight leading-tight line-clamp-2 drop-shadow-md mb-3"
        [title]="info?.name || 'Playlist'"
      >
        {{ info?.name || 'Playlist sin título' }}
      </h1>

      <!-- Curator & Stats info -->
      <div
        class="flex flex-wrap items-center justify-center sm:justify-start gap-2 text-xs sm:text-sm text-neutral-400 mb-5"
      >
        @if (info?.artist?.name) {
          <span class="font-medium text-neutral-200 hover:text-white transition-colors">
            {{ info?.artist?.name }}
          </span>
          <span class="text-neutral-600 font-bold">•</span>
        }

        <span class="inline-flex items-center gap-1 text-neutral-300">
          <svg lucideListMusic class="w-3.5 h-3.5 text-purple-400"></svg>
          {{ songCountLabel() }}
        </span>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-3">
        <button
          type="button"
          (click)="playAll.emit()"
          class="h-11 px-6 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 active:scale-95 text-white font-semibold text-sm shadow-lg transition-all duration-500 flex items-center gap-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-purple-400"
          [style.background]="playButtonStyle()['background']"
          [style.box-shadow]="playButtonStyle()['box-shadow']"
        >
          <svg lucidePlay class="w-4 h-4 fill-white text-white translate-x-0.5"></svg>
          <span>Reproducir</span>
        </button>

        <button
          type="button"
          (click)="playShuffle.emit()"
          class="h-11 px-5 rounded-full bg-white/10 hover:bg-white/15 active:scale-95 text-neutral-200 hover:text-white font-medium text-sm border border-white/10 transition-all flex items-center gap-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-purple-400"
          title="Reproducción aleatoria"
        >
          <svg lucideShuffle class="w-4 h-4 text-purple-300"></svg>
          <span>Aleatorio</span>
        </button>
      </div>
    </div>
  </div>
</div>
