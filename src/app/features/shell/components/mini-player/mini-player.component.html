<div
  class="w-full h-full bg-[#0d0b16] flex flex-col p-2.5 select-none relative overflow-hidden text-white border border-white/15 rounded-2xl shadow-2xl transition-all"
  [style.background]="
    'radial-gradient(circle at 85% 15%, rgba(' +
    dominantRgbString() +
    ', 0.28) 0%, rgba(13, 11, 22, 0.95) 70%), #0d0b16'
  "
  [style.border-color]="'rgba(' + dominantRgbString() + ', 0.4)'"
  [style.box-shadow]="'0 10px 30px -5px rgba(' + dominantRgbString() + ', 0.35)'"
>
  <!-- Mini Window Header (Draggable) -->
  <div
    class="flex items-center justify-between h-5 w-full shrink-0 mb-1"
    style="-webkit-app-region: drag"
  >
    <!-- Brand / Mini Status -->
    <div class="flex items-center gap-1.5 px-0.5 pointer-events-none">
      <span
        class="w-2 h-2 rounded-full animate-pulse"
        [style.background-color]="'rgb(' + dominantRgbString() + ')'"
      ></span>
      <span class="text-[10px] font-bold tracking-wider text-white/50 uppercase">Sonara Mini</span>
    </div>

    <!-- Window Actions (No-drag) -->
    <div class="flex items-center gap-1" style="-webkit-app-region: no-drag">
      <!-- Restore / Expand to full window -->
      <button
        type="button"
        (click)="restoreFullWindow()"
        class="p-1 text-white/60 hover:text-white hover:bg-white/10 rounded-md transition-colors cursor-pointer"
        title="Restaurar ventana completa"
        aria-label="Restaurar ventana completa"
      >
        <svg lucideMaximize2 class="w-3 h-3"></svg>
      </button>

      <!-- Minimize to taskbar / dock -->
      <button
        type="button"
        (click)="minimizeToTaskbar()"
        class="p-1 text-white/60 hover:text-white hover:bg-white/10 rounded-md transition-colors cursor-pointer"
        title="Minimizar a la barra de tareas"
        aria-label="Minimizar a la barra de tareas"
      >
        <svg lucideMinus class="w-3 h-3"></svg>
      </button>

      <!-- Close app -->
      <button
        type="button"
        (click)="close()"
        class="p-1 text-white/60 hover:text-red-400 hover:bg-red-500/20 rounded-md transition-colors cursor-pointer"
        title="Cerrar aplicación"
        aria-label="Cerrar aplicación"
      >
        <svg lucideX class="w-3 h-3"></svg>
      </button>
    </div>
  </div>

  <!-- Mini Player Body -->
  <div class="flex-1 min-h-0 flex items-center gap-3">
    <!-- 1. Song Cover Artwork -->
    <div
      class="w-20 h-20 sm:w-22 sm:h-22 rounded-xl shrink-0 overflow-hidden relative shadow-lg border border-white/15 bg-black/40 flex items-center justify-center group"
    >
      @if (currentArtworkUrl()) {
        <img
          #miniImg
          crossorigin="anonymous"
          [src]="currentArtworkUrl()"
          [alt]="trackTitle()"
          (load)="onImageLoad(miniImg)"
          class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
        />
      } @else {
        <svg lucideMusic class="w-8 h-8 text-white/20"></svg>
      }
    </div>

    <!-- 2. Track Info, Animated Wave & Controls -->
    <div class="flex-1 min-w-0 flex flex-col justify-between h-full py-0.5">
      <!-- Title & Artist -->
      <div class="min-w-0 pr-1">
        <h2 class="text-xs sm:text-sm font-bold text-white tracking-tight truncate leading-snug">
          {{ trackTitle() }}
        </h2>
        <p class="text-[11px] text-white/60 font-medium truncate mt-0.5">
          {{ trackAuthor() }}
        </p>
      </div>

      <!-- 3. Animated Wave Visualizer (Reflecting Song Colors, Click to change style) -->
      <div
        class="w-full h-7 relative my-0.5 flex items-end justify-center cursor-pointer group"
        (click)="cycleVisualizerStyle()"
        title="Clic para cambiar estilo de onda"
      >
        <canvas
          #miniVisualizer
          aria-hidden="true"
          class="w-full h-full pointer-events-none"
          [style.filter]="'drop-shadow(0 0 8px rgba(' + dominantRgbString() + ', 0.65))'"
        ></canvas>
      </div>

      <!-- 4. Playback Actions (Previous, Play/Pause, Next) -->
      <div class="flex items-center justify-between shrink-0 pt-0.5">
        <div class="flex items-center gap-2">
          <!-- Previous track -->
          <button
            type="button"
            (click)="playbackService.previous()"
            [disabled]="!playbackService.$hasPrevious()"
            class="p-1.5 text-white/70 hover:text-white hover:bg-white/10 active:scale-95 disabled:opacity-30 disabled:pointer-events-none rounded-full transition-all cursor-pointer"
            title="Pista anterior"
            aria-label="Pista anterior"
          >
            <svg lucideSkipBack class="w-4 h-4 fill-current"></svg>
          </button>

          <!-- Play / Pause prominent button -->
          <button
            type="button"
            (click)="playbackService.togglePlay()"
            class="w-8 h-8 rounded-full bg-white text-black hover:scale-105 active:scale-95 flex items-center justify-center transition-all shadow-[0_0_15px_rgba(255,255,255,0.4)] cursor-pointer"
            [style.box-shadow]="'0 0 16px rgba(' + dominantRgbString() + ', 0.6)'"
            [attr.aria-label]="playbackService.$isPlaying() ? 'Pausar' : 'Reproducir'"
            title="Reproducir / Pausar"
          >
            @if (playbackService.$isPlaying()) {
              <svg lucidePause class="w-4 h-4 fill-current"></svg>
            } @else {
              <svg lucidePlay class="w-4 h-4 fill-current translate-x-0.5"></svg>
            }
          </button>

          <!-- Next track -->
          <button
            type="button"
            (click)="playbackService.playNext()"
            [disabled]="!playbackService.$hasNext()"
            class="p-1.5 text-white/70 hover:text-white hover:bg-white/10 active:scale-95 disabled:opacity-30 disabled:pointer-events-none rounded-full transition-all cursor-pointer"
            title="Siguiente pista"
            aria-label="Siguiente pista"
          >
            <svg lucideSkipForward class="w-4 h-4 fill-current"></svg>
          </button>
        </div>

        <!-- Mute / Unmute button -->
        <button
          type="button"
          (click)="playbackService.toggleMute()"
          class="p-1.5 text-white/50 hover:text-white hover:bg-white/10 rounded-full transition-colors cursor-pointer"
          [title]="playbackService.$isMuted() ? 'Activar sonido' : 'Silenciar'"
          aria-label="Silenciar / Activar sonido"
        >
          <span class="text-[10px] font-mono text-white/70">
            {{ playbackService.$isMuted() ? 'MUTE' : 'VOL' }}
          </span>
        </button>
      </div>
    </div>
  </div>
</div>
